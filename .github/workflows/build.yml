name: Build bandwidth pthread ARM32
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK r21e
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          local-cache: true

      - name: Compile armeabi-v7a bandwidth
        run: |
          export NDK=${{ steps.setup_ndk.outputs.ndk-path }}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang
          $CC -O3 -mfpu=neon -mfloat-abi=hard -pthread bandwidth.c -o bandwidth-armeabi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bandwidth-arm32
          path: bandwidth-armeabi
